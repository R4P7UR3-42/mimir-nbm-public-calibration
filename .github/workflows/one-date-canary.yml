name: NOAA NBM Q95 one-date canary

on:
  schedule:
    # Prior-day 12Z f042 must already have been published by the frozen 20:00 UTC causal deadline.
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      market_date:
        description: Exact market date; source is prior-day 12Z f042
        required: true
        default: "2026-09-02"
        type: string

permissions:
  contents: write

env:
  TMPDIR: /var/tmp

concurrency:
  group: noaa-nbm-q95-daily-source-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Resolve one exact market date
        id: market-date
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MARKET_DATE: ${{ inputs.market_date }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            MARKET_DATE="$(deno eval 'import { scheduledMarketDate } from "./scripts/capture.ts"; console.log(scheduledMarketDate(new Date()));')"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MARKET_DATE="$DISPATCH_MARKET_DATE"
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          [[ "$MARKET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "market_date=$MARKET_DATE" >> "$GITHUB_OUTPUT"
      - name: Validate source-only contract
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.market_date }}
        run: |
          [[ "$MARKET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          deno task check
          deno task test
          deno task lint
      - name: Verify create-once durable evidence before provider access
        id: persistence
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.market_date }}
        run: |
          STATE="$(deno run --allow-read=. scripts/persist.ts preflight --market-date "$MARKET_DATE")"
          if [[ "$STATE" == "existing" ]]; then
            echo "capture_required=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATE" == "missing" ]]; then
            echo "capture_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "unsupported persistence state: $STATE" >&2
            exit 1
          fi
      - name: Install exact decoder versions
        if: steps.persistence.outputs.capture_required == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Capture exactly one date with two NOAA requests
        if: steps.persistence.outputs.capture_required == 'true'
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.market_date }}
        run: |
          umask 077
          deno run \
            --allow-read=.,/var/tmp/nbm-q95-canary \
            --allow-write=/var/tmp \
            --allow-run=python3 \
            --allow-net=noaa-nbm-grib2-pds.s3.amazonaws.com:443 \
            scripts/capture.ts \
            --market-date "$MARKET_DATE" \
            --output-dir /var/tmp/nbm-q95-canary \
            --max-requests 2
          cd /var/tmp/nbm-q95-canary
          sha256sum -c SHA256SUMS
          jq -e '
            .research_only == true and
            .source_only == true and
            .provider_confirmed_fill_evidence == false and
            .recommendation_authority == false and
            .order_authority == false and
            .capital_risk_authority == false and
            .trading_authority == false and
            .production_activation == false and
            .active_trading_capability_changed == false and
            .automatic_production_activation == false and
            .request_policy.maximum_requests == 2 and
            .request_policy.actual_requests == 2 and
            .request_policy.no_retry == true and
            .request_policy.terminal_http_429 == true and
            .coverage.stations == 20 and
            .coverage.complete == true
          ' evidence.json
      - name: Preserve checksum-bound evidence create-once
        if: steps.persistence.outputs.capture_required == 'true'
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.market_date }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          deno run \
            --allow-read=.,/var/tmp/nbm-q95-canary \
            --allow-write=evidence \
            scripts/persist.ts preserve \
            --market-date "$MARKET_DATE" \
            --source-dir /var/tmp/nbm-q95-canary \
            --workflow-source-sha "$WORKFLOW_SOURCE_SHA" \
            --workflow-run-id "$WORKFLOW_RUN_ID" \
            --workflow-run-attempt "$WORKFLOW_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "evidence/$MARKET_DATE/evidence.json" \
            "evidence/$MARKET_DATE/provenance.json" \
            "evidence/$MARKET_DATE/SHA256SUMS"
          git diff --cached --quiet && { echo "new evidence produced no create-once diff" >&2; exit 1; }
          git commit -m "evidence: preserve NOAA NBM Q95 $MARKET_DATE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Reverify durable evidence without provider access
        env:
          MARKET_DATE: ${{ steps.market-date.outputs.market_date }}
        run: |
          test "$(deno run --allow-read=. scripts/persist.ts preflight --market-date "$MARKET_DATE")" = "existing"
          cd "evidence/$MARKET_DATE"
          sha256sum -c SHA256SUMS
      - name: Upload checksum-bound public evidence convenience copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noaa-nbm-q95-${{ steps.market-date.outputs.market_date }}-${{ github.run_id }}
          path: |
            evidence/${{ steps.market-date.outputs.market_date }}/evidence.json
            evidence/${{ steps.market-date.outputs.market_date }}/provenance.json
            evidence/${{ steps.market-date.outputs.market_date }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
