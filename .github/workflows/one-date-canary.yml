name: NOAA NBM Q95 one-date canary

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: Exact market date; source is prior-day 12Z f042
        required: true
        default: "2026-09-01"
        type: string

permissions:
  contents: read

env:
  TMPDIR: /var/tmp

concurrency:
  group: noaa-nbm-q95-one-date
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Validate source-only contract
        env:
          MARKET_DATE: ${{ inputs.market_date }}
        run: |
          [[ "$MARKET_DATE" =~ ^2026-[0-9]{2}-[0-9]{2}$ ]]
          deno task check
          deno task test
          deno task lint
      - name: Install exact decoder versions
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Capture exactly one date with two NOAA requests
        env:
          MARKET_DATE: ${{ inputs.market_date }}
        run: |
          umask 077
          deno run \
            --allow-read=.,/var/tmp/nbm-q95-canary \
            --allow-write=/var/tmp \
            --allow-run=python3 \
            --allow-net=noaa-nbm-grib2-pds.s3.amazonaws.com:443 \
            scripts/capture.ts \
            --market-date "$MARKET_DATE" \
            --output-dir /var/tmp/nbm-q95-canary \
            --max-requests 2
          cd /var/tmp/nbm-q95-canary
          sha256sum -c SHA256SUMS
          jq -e '.research_only == true and .trading_authority == false and .request_policy.actual_requests == 2 and .coverage.stations == 20 and .coverage.complete == true' evidence.json
      - name: Upload checksum-bound public evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noaa-nbm-q95-${{ inputs.market_date }}-${{ github.run_id }}
          path: |
            /var/tmp/nbm-q95-canary/evidence.json
            /var/tmp/nbm-q95-canary/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
